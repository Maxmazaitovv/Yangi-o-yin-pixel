name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["game.zip"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zipni ochish
        run: |
          mkdir app
          unzip -o game.zip -d app
          ls app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android loyiha yaratish
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Ikonka va gorizontal rejim
        working-directory: app
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
      - name: APK yigish
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZulmatAlangasi-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
